{% extends "base.html" %}
{% block title %}Forgot Password — AwaazAI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">AwaazAI</div>
    <div class="auth-title">Reset your password</div>
    <div class="auth-sub">Enter your email and we'll send you a reset link.</div>
    <form class="auth-form" method="POST">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input class="form-input" type="email" name="email" placeholder="you@example.com" required/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;">Send Reset Link</button>
    </form>
    <div class="auth-footer"><a href="/login">Back to login</a></div>
  </div>
</div>
{% endblock %}
