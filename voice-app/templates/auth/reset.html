{% extends "base.html" %}
{% block title %}Reset Password — AwaazAI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">AwaazAI</div>
    <div class="auth-title">Set new password</div>
    <div class="auth-sub">Choose a strong password for your account.</div>
    <form class="auth-form" method="POST">
      <div class="form-group">
        <label class="form-label">New Password</label>
        <input class="form-input" type="password" name="password" placeholder="Min 6 characters" required autocomplete="new-password"/>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;padding:13px;">Reset Password</button>
    </form>
    <div class="auth-footer"><a href="/login">Back to login</a></div>
  </div>
</div>
{% endblock %}
